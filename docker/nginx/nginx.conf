daemon off;
error_log /dev/stderr error;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    client_max_body_size 10m;

    log_format main '[$time_local] "$request" $status $remote_addr "$http_user_agent"';
    access_log /dev/stdout main;

    # Trust proxies
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Larger responses stay in memory instead of temporary files
    fastcgi_buffer_size 32k;
    fastcgi_buffers 16 16k;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/javascript application/json application/manifest+json image/svg+xml font/ttf;

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;
        root /app/public;

        index index.php;

        include /etc/nginx/snippets/security-headers.conf;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Only the front controller runs, no other PHP file under public
        location = /index.php {
            fastcgi_pass unix:/run/php-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }

        location ~ \.php$ {
            return 404;
        }

        # Health checks and Livewire updates go straight to the front controller
        location ~ ^/(?:(?:api/)?up$|livewire/) {
            access_log off;

            fastcgi_pass unix:/run/php-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            include fastcgi_params;
        }

        # Vite assets carry a hash, published vendor assets a version, and uploaded files a unique name in their URL
        location ~ ^/(?:build|storage|vendor)/ {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";

            access_log off;
            log_not_found off;
        }
    }
}
