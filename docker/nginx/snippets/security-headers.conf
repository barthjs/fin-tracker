# Security headers for every response. Nginx drops inherited add_header directives in a block that sets its own,
# so each location with its own add_header includes this file again.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Content-Type-Options "nosniff" always;
# Browsers that predate frame-ancestors in the policy still honor this header
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "fullscreen=(self), camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
# Livewire and Alpine render inline scripts and styles, so script and style sources stay unrestricted
add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
