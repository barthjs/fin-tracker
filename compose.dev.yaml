services:
  fin-tracker:
    build:
      context: .
      target: dev
    pull_policy: never
    image: barthjs/fin-tracker:dev
    container_name: fin-tracker
    volumes:
      - ./:/app
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    network_mode: host

  database:
    image: postgres:18-alpine
    container_name: fin-tracker-db
    working_dir: /pgsqldump
    volumes:
      - ./database:/pgsqldump
      - db_data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    network_mode: host

volumes:
  db_data:
